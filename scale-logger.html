<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scale Logger</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--text:#e8eaed;--muted:#9aa0a6;--acc:#4fc3f7;--ok:#81c995;--warn:#fdd663}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{background:var(--acc);color:#000;border:0;border-radius:8px;padding:12px 14px;font-weight:600;font-size:15px}
button.sec{background:#2a2f3a;color:var(--text)}
button:disabled{opacity:.4}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
#status{color:var(--muted);font-size:13px;margin-bottom:12px}
input{background:#0b0d11;color:var(--text);border:1px solid #333;border-radius:8px;padding:10px;font:14px ui-monospace,monospace;flex:1;min-width:0}
#log{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow:auto}
.A2{color:var(--ok)}.other{color:var(--warn)}.sys{color:var(--muted)}
</style>
</head>
<body>
<h1>Scale Logger</h1>
<p class="sub">Captures every packet from the Healthkeep scale (service FFB0) for decoding.</p>

<div class="row">
  <button id="connect">Connect</button>
  <button class="sec" id="copy">Copy log</button>
  <button class="sec" id="clear">Clear</button>
</div>
<div id="status">Close Fitdays and nRF Connect, step on the scale to wake it, then tap Connect.</div>

<div class="card">
  <div class="label">Live weight (bytes 7–8 ÷ 100)</div>
  <div class="big"><span id="weight">–</span> <span style="font-size:20px">kg</span></div>
</div>

<div class="card">
  <div class="label">What the scale displayed</div>
  <div class="row" style="margin:6px 0 0"><input id="note" placeholder="e.g. 109.4 kg, 28.5% fat"></div>
</div>

<div class="card">
  <div class="label">Log (<span id="count">0</span> lines)</div>
  <div id="log"></div>
</div>

<div class="card">
  <div class="label">Send hex to FFB1 (for later experiments)</div>
  <div class="row" style="margin:6px 0 0">
    <input id="hexin" placeholder="e.g. 0A 00 A1 …">
    <button class="sec" id="send">Send</button>
  </div>
</div>

<script>
const SVC=0xffb0, W=0xffb1, N=0xffb2, I=0xffb3;
let dev=null, wChar=null, lines=[];
const $=id=>document.getElementById(id);
const toHex=b=>[...b].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
const status=s=>$('status').textContent=s;

function log(text,cls){
  const now=new Date();
  const ts=now.toLocaleTimeString('en-GB',{hour12:false})+'.'+String(now.getMilliseconds()).padStart(3,'0');
  lines.push(ts+' '+text);
  const d=document.createElement('div');
  d.textContent=ts+' '+text;
  if(cls) d.className=cls;
  $('log').appendChild(d);
  $('log').scrollTop=$('log').scrollHeight;
  $('count').textContent=lines.length;
}

async function connect(){
  if(!navigator.bluetooth){status('Web Bluetooth not available. Use Chrome on Android, on an https page.');return;}
  try{
    if(!dev){
      dev=await navigator.bluetooth.requestDevice({
        filters:[{namePrefix:'HEALTHKEEP'},{services:[SVC]}],
        optionalServices:[SVC,0x180a]
      });
      dev.addEventListener('gattserverdisconnected',()=>{
        log('-- disconnected','sys');
        status('Disconnected. Step on the scale to wake it, then tap Connect.');
        $('connect').disabled=false; wChar=null;
      });
    }
    status('Connecting…');
    const server=await dev.gatt.connect();
    log('-- connected to '+(dev.name||'scale'),'sys');

    try{
      const info=await server.getPrimaryService(0x180a);
      for(const [u,label] of [[0x2a29,'Manufacturer'],[0x2a24,'Model'],[0x2a26,'Firmware'],[0x2a27,'Hardware'],[0x2a28,'Software']]){
        try{const v=await (await info.getCharacteristic(u)).readValue();log(label+': '+new TextDecoder().decode(v),'sys');}catch(e){}
      }
    }catch(e){}

    const svc=await server.getPrimaryService(SVC);
    wChar=await svc.getCharacteristic(W);
    for(const [u,name] of [[N,'FFB2'],[I,'FFB3']]){
      const c=await svc.getCharacteristic(u);
      c.addEventListener('characteristicvaluechanged',ev=>onData(name,ev.target.value));
      await c.startNotifications();
    }
    status('Listening. Stand barefoot, hold the handle, and stay on until the display finishes.');
    $('connect').disabled=true;
  }catch(e){status('Error: '+e.message);}
}

function onData(name,v){
  const b=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);
  const type=b.length>3?b[3].toString(16).toUpperCase().padStart(2,'0'):'??';
  let extra='';
  if(type==='A2'&&b.length>8){
    const kg=((b[7]<<8)|b[8])/100;
    extra='  -> '+kg.toFixed(2)+' kg?';
    $('weight').textContent=kg.toFixed(2);
  }
  log(name+' ['+type+'] '+toHex(b)+extra, type==='A2'?'A2':'other');
}

async function send(){
  if(!wChar){status('Connect first.');return;}
  const s=$('hexin').value.replace(/[^0-9a-f]/gi,'');
  if(!s||s.length%2){status('Enter an even number of hex digits.');return;}
  const bytes=new Uint8Array(s.match(/../g).map(h=>parseInt(h,16)));
  try{
    if(wChar.writeValueWithResponse) await wChar.writeValueWithResponse(bytes); else await wChar.writeValue(bytes);
    log('FFB1 << '+toHex(bytes),'sys');
  }catch(e){status('Write failed: '+e.message);}
}

function copy(){
  const note=$('note').value.trim();
  const text=(note?'Display: '+note+'\n':'')+lines.join('\n');
  navigator.clipboard.writeText(text).then(
    ()=>status('Log copied. Paste it into Claude.'),
    ()=>status('Copy failed. Long-press the log to select it instead.'));
}

$('connect').onclick=connect;
$('copy').onclick=copy;
$('clear').onclick=()=>{lines=[];$('log').innerHTML='';$('count').textContent='0';$('weight').textContent='–';};
$('send').onclick=send;
</script>
</body>
</html>
